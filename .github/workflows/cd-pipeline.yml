
name: CD Pipeline to Render

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}
  release:
    types: [published]

env:
  PORT: 5001
  IMAGE: wafaallouche/ci-cd-tuto

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test application

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Build, push and deploy to Render

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest .

      - name: Push image to Docker Hub
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy image to Render
        if: |
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
          (github.event_name == 'release' &&
           github.event.action == 'published' &&
           github.event.release.target_commitish == 'main')
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --get \
            --data-urlencode "imgURL=docker.io/${{ env.IMAGE }}:${{ github.sha }}" \
            "$RENDER_DEPLOY_HOOK_URL"
